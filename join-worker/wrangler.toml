name = "m2-join"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false   # test copies of the worker would skip the staff sign-in gate
# Variables set in the dashboard (like CHASE_DAYS) are kept on deploy.
keep_vars = true

[vars]
GM_BASE = "https://m2trainingclub.gymmasteronline.com/portal/api"
COMPANY_ID = "4"
PT_SCRIPT = ""   # off: new members book via the free-pt.html button on the confirmation screen
BILLING_GRACE_DAYS = "3"
HIDE_IDS = ""
ALLOWED_ORIGINS = "https://m2club.co.nz,https://www.m2club.co.nz"
# PASSPORT_IDS and CORE_URL are set as secrets in the dashboard.

# Secret (not in this file): GM_API_KEY
#   npx wrangler secret put GM_API_KEY
# Secret: INTAKE_KEY (same value as M2 Core's INTAKE_KEY), sends Passport IDs to the Core
#   npx wrangler secret put INTAKE_KEY

# Direct line to M2 Core. Calls through this binding skip the Core's staff sign-in, so the
# member-facing pages (unsubscribe, after the bank form) and Passport sign-ups reach it.
[[services]]
binding = "CORE"
service = "m2-core"
