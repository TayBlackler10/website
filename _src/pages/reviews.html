<section class="section section-top0" data-section="reviews">
  <div class="wrap">
    <div class="section-head reveal">
      <div class="stack">
        <span class="eyebrow">In their words</span>
        <h2 class="h-lg">More from our members</h2>
      </div>
      <a class="btn btn-dark" href="/memberships.html">View memberships</a>
    </div>
    <div class="rv-cols">
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Best gym in Auckland, and I've trained around the world. What really sets M2 apart is the integrity of the management team. The equipment is excellent, the floor never feels overcrowded, and the location is perfect. One of the most complete gyms in Auckland, sauna, steam room, pool, plunge pool, and jacuzzi. You'd be hard-pressed to find this combination anywhere else.</blockquote><figcaption>Richmond Tan <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I've been training at M2 for almost two years now and it's honestly been one of the best decisions I've made for myself. The equipment is great and the staff are hugely supportive and welcoming. With a pool, cold plunge, sauna, and posing room, the facilities are genuinely next level.</blockquote><figcaption>Mai Merimo <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I have been a member since the gym first opened and can confidently say it is an outstanding facility. It offers a comprehensive range of equipment supporting various training styles, including Hyrox and functional fitness. The team is welcoming, knowledgeable, and always willing to assist, delivering high-quality classes that foster a strong sense of community and support.</blockquote><figcaption>Lydia Finch <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Hands down the best training facility in Auckland. The functional fitness and lifting setup are world class. The recovery facilities, ice bath, sauna, and pool, make it a complete package. Staff are always helpful and the community vibe is unmatched. Highly recommend.</blockquote><figcaption>Hannah Chapman <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I have been part of M2 for several years and managed to convince people to join because of how much I like it. The vibe is inviting and while it isn't as big as a commercial gym, it's hardly ever busy and has more than enough equipment, including machines you won't find elsewhere. The sauna and steam room are accessible through the changing rooms and gender separated. Highly highly recommend.</blockquote><figcaption>Erena Waretini <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>M2 is one of the best gyms in Auckland if you're serious about HYROX and functional fitness. The programming is excellent, the space is perfect for HYROX-style training, and the atmosphere is motivating without being intimidating. Coach Dave Blint brings great energy, deep HYROX knowledge, and real race experience. He knows exactly how to push athletes while keeping training smart and sustainable. Great gym, great coaching.</blockquote><figcaption>Ian Pollard <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Easily one of the best training spaces in Auckland. Incredibly well equipped, whether you're lifting heavy, doing classes, circuit training, or just training without feeling crammed. What really sets it apart is the recovery spaces: the saunas, cold plunge, and spa are unreal. Being able to train and recover properly all in one place is a game changer. If you're looking for a gym that has everything covered, this place is it.</blockquote><figcaption>Aleisha Fee <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Great gym with a massive range of equipment. Very spacious for a central location, never feels too busy even when there's a lot of members in. Parking is provided which is super convenient. Staff are super friendly and welcoming. Overall one of the best gyms I've been to.</blockquote><figcaption>Theo Stratford <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I started training at M2 about 8 months ago for the Hyrox classes. While the sauna, ice baths, steam room, and swimming pool are a lovely treat, the Hyrox classes are by far my favourite part of the membership, far beyond the standard of any other gym I've been to for weekly classes.</blockquote><figcaption>Niamh Elliott <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>The sauna and ice bath are absolute game-changers after a workout. Amazing gym with fantastic facilities and equipment. Special shoutout to Bekka, an incredible PT who brings great energy every single session. The whole M2 experience is genuinely next level.</blockquote><figcaption>Sophie Thompson <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Dave is a great trainer. Very dedicated and works hard to make sure his customers get great results.</blockquote><figcaption>Lee Peace <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I've been training at M2 for a couple of years now and it's been a great experience. The equipment is new, the gym is well maintained, and the trainers are all friendly and really know their stuff. Special shoutout to my PT Tim, absolute legend! He's knowledgeable, fun to train with, flexible with scheduling, and has a great sense of when to push me and when to ease off. Highly recommend if you're looking for a supportive and professional gym.</blockquote><figcaption>Ekaterina Sukhova <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Great gym with a really good atmosphere. It's always clean, well set up, and the people there make it a nice place to train. I've been doing PT with Tim and would definitely recommend him. He's really knowledgeable, focuses a lot on proper form, and pushes you in a way that actually helps you improve. I've noticed a big difference in my strength since starting sessions with him. Overall a great gym and a great trainer.</blockquote><figcaption>Angela McKnight <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Great gym at an excellent location, friendly staff and knowledgeable trainers!</blockquote><figcaption>Denise Matijevich <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>When I moved to Auckland at the end of 2023, I needed an all round, great gym that facilitated everyone and everything. M2 is just that. Whether you're a once a week visitor or seven, this gym will have exactly what you need to improve.</blockquote><figcaption>Liam Shaw <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Awesome gym. Moved here in November and can't think of a gym with better facilities. Sauna, cold plunge, pool, and the gym floor equipment are next level.</blockquote><figcaption>Jack Yeoman <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Have recently started training at M2, the facilities are great and there's always equipment free. The Hyrox themed classes that Dave runs have been keeping me in check too.</blockquote><figcaption>Thomas Jensen <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I've been going to M2 for over 6 months now and it was actually my first ever gym experience. I was really nervous about joining a gym but the staff at M2 made me feel so welcome from day one. The classes are great, the facilities are incredible, and I've made real progress I'm proud of.</blockquote><figcaption>Sue S <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>Awesome facility and good vibes! Everything you need and more. Tim is an awesome coach!!</blockquote><figcaption>Katelyn Larking <span>· Google review</span></figcaption></figure>
      <figure class="review"><span class="stars" aria-label="5 stars">★★★★★</span><blockquote>I've been training at M2 Fitness for just over a year and have absolutely loved being part of the community. The coaches are great, the facilities are top notch, and the atmosphere keeps you coming back. Highly recommend to anyone looking for a gym that has it all.</blockquote><figcaption>Trent Fleet <span>· Google review</span></figcaption></figure>
