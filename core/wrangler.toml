name = "m2-core"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Nightly copy from GymMaster at 2:15am NZ daylight time (1:15am in winter).
[triggers]
crons = ["15 13 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "m2-core"
database_id = "PASTE_ID_FROM_wrangler_d1_create"

[vars]
GM_BASE = "https://m2trainingclub.gymmasteronline.com/portal/api"
ACCESS_TEAM = "PASTE_TEAM_NAME"   # the part before .cloudflareaccess.com
GM_SITE = "https://m2trainingclub.gymmasteronline.com"
COMPANY_ID = "4"
# Where reception enters bank details on Add member.
#   "gymmaster" (now): opens the member's GymMaster profile, because GymMaster still bills.
#   "ezidebit" (after the billing pilot): Ezidebit's own secure form, on screen or by QR on the member's phone.
BILLING_MODE = "gymmaster"
EZIDEBIT_EDDR_BASE = ""    # Ezidebit eDDR form address for NZ, confirm with Ezidebit
EZIDEBIT_PUBLIC_KEY = ""   # Ezidebit public key (not secret), from Ezidebit

# Secrets, set with wrangler (never in this file, never in chat):
#   npx wrangler secret put GM_STAFF_KEY   GymMaster staff API key (nightly copy)
#   npx wrangler secret put GM_API_KEY     GymMaster low permission API key (Add member, same one m2-join uses)
#   npx wrangler secret put ACCESS_AUD     Application Audience (AUD) tag from Cloudflare Access
