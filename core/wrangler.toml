name = "m2-core"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Keep logs so failed nightly copies and balance checks can be seen in the Cloudflare dashboard.
[observability]
enabled = true

# Nightly copy from GymMaster at 2:15am NZ daylight time (1:15am in winter).
[triggers]
crons = ["15 13 * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "m2-core"
database_id = "9a0cdcf5-5ae4-4415-9db7-02df2bb7c425"

[vars]
GM_BASE = "https://m2trainingclub.gymmasteronline.com/portal/api"
ACCESS_TEAM = "taylor-3e5"
ACCESS_AUD = "adc7385733432fc29a0046959fdad0c0b909df6be50faf285b05bcab1b43338b"   # Access application tag (not secret, it is in every sign-in token)
GM_SITE = "https://m2trainingclub.gymmasteronline.com"
COMPANY_ID = "4"
ALLOWED_ORIGINS = "https://m2club.co.nz,https://www.m2club.co.nz"
# Where reception enters bank details on Add member.
#   "gymmaster" (now): opens the member's GymMaster profile, because GymMaster still bills.
#   "ezidebit" (after the billing pilot): Ezidebit's own secure form, on screen or by QR on the member's phone.
BILLING_MODE = "gymmaster"
EZIDEBIT_EDDR_BASE = ""    # Ezidebit eDDR form address for NZ, confirm with Ezidebit
EZIDEBIT_PUBLIC_KEY = ""   # Ezidebit public key (not secret), from Ezidebit
LAP_SIZE = "150"       # members checked per 15 minutes (balance and visits), on the Workers Paid plan. Use 10 on the free plan.
FP_MEMBERSHIP_ID = "844596" # GymMaster membership type "Fitness Passport" (1,234 members, 3 Oct 2026)

# Secrets, set with wrangler (never in this file, never in chat):
#   npx wrangler secret put GM_STAFF_KEY   GymMaster staff API key (nightly copy)
#   npx wrangler secret put GM_API_KEY     GymMaster low permission API key (Add member, same one m2-join uses)
#   npx wrangler secret put INTAKE_KEY     Shared key for website forms posting leads (any long random string)
# Later, only when the Core reports Passport visits itself (after GymMaster):
#   npx wrangler secret put FP_SITE_TOKEN    and    FP_DEVICE_TOKEN   (from Fitness Passport, same as in GymMaster)
#   npx wrangler secret put ACCESS_AUD     Application Audience (AUD) tag from Cloudflare Access

# Read only: the month-end snapshots m2-command has kept since 2025, shown on Growth.
[[kv_namespaces]]
binding = "M2CC"
id = "d4237aaa27d24bddb1e4fc7f6b67b863"

# Nightly backups of the whole Core (kept 35 days). Switch on once R2 is added to the account
# and a bucket called m2-core-backups exists:
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "m2-core-backups"
